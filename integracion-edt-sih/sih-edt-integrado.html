/* ===== Shell SDN — no modificar salvo cambio institucional ===== */
:root {
  --sdn-header-gob-height: 80px;   /* barra gob.mx que inyecta gobmx.js */
  --sdn-user-bar-height: 54px;     /* barra de usuario Cartillas */
  --sdn-dorado: #BC955C;           /* franja del footer; sin token en Cartillas (en Receta Completa figura como «ejemplo») */
}
html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-family); background: var(--color-background); color: var(--color-neutral-700); }
.sdn-layout { display: flex; flex-direction: column; min-height: 100vh; }
.main-footer { display: none !important; }

/* Respaldo de la barra gob.mx: solo se muestra si gobmx.js no carga (sin conexión o vista previa que bloquea scripts externos).
   Medidas de la barra institucional de Cartillas, al alto de 80 px que reserva Receta Completa. No sustituye a la oficial. */
.sdn-gob-fallback { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 101; height: var(--sdn-header-gob-height); box-sizing: border-box; padding: var(--space-5) 30px; align-items: center; background: var(--color-brand); box-shadow: var(--shadow-header); color: var(--color-surface); font: 600 var(--font-size-xl)/1 var(--font-family); }
.sdn-sin-gob .sdn-gob-fallback { display: flex; } /* se oculta el footer que inyecta gob.mx; se usa el footer IMSS */

/* Barra de usuario (Cartillas: alto 54, padding 8/16, surface-alt, shadow-sm) */
.sdn-user-bar { position: fixed; top: var(--sdn-header-gob-height); left: 0; right: 0; z-index: 100; height: var(--sdn-user-bar-height); box-sizing: border-box; padding: var(--space-2) var(--space-4); display: flex; align-items: center; justify-content: space-between; background: var(--color-surface-alt); box-shadow: var(--shadow-sm); font-family: var(--font-family); }
.sdn-user-bar__title { display: flex; align-items: center; gap: var(--space-3); margin: 0; font-size: var(--font-size-lg); font-weight: 600; line-height: 1.2; color: var(--color-neutral-700); }
.sdn-user-bar__title svg { height: 32px; width: auto; }
.sdn-user-bar__sep { width: 1px; height: 22px; background: var(--color-neutral-200); }
.sdn-user-bar__user { display: flex; align-items: center; gap: var(--space-3); text-align: right; }
.sdn-user-bar__name { display: block; font-size: var(--font-size-sm); font-weight: 700; line-height: 1.2; color: var(--color-neutral-700); }
.sdn-user-bar__rol { display: block; font-size: var(--font-size-sm); font-weight: 400; line-height: 1.2; color: var(--color-neutral-700); }

.sdn-main { flex: 1; padding-top: calc(var(--sdn-header-gob-height) + var(--sdn-user-bar-height)); }

/* Footer IMSS (Receta Completa): guinda + franja dorada + imagen institucional */
.sdn-footer { position: relative; min-height: 75px; display: flex; align-items: center; justify-content: center; background: var(--color-brand); padding: var(--space-4) var(--space-6) calc(var(--space-4) + 1vh); }
.sdn-footer::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1vh; background: var(--sdn-dorado); }
.sdn-footer svg { max-width: 100%; height: auto; }

/* Pantallas angostas (≤640 px): el nombre del sistema se ve completo en hasta 3 líneas; el rol se oculta para dejar espacio */
@media (max-width: 640px) {
  .sdn-user-bar { gap: var(--space-2); }
  .sdn-user-bar__title { min-width: 0; gap: var(--space-2); font-size: var(--font-size-xs); line-height: 1.2; }
  .sdn-user-bar__name { font-size: var(--font-size-xs); }
  .sdn-user-bar__rol { display: none; }
}
/* El CSS de gob.mx asigna Patria a los encabezados y su propio estilo a los controles. En la pantalla todo va en Noto Sans (Cartillas). */
.sdn-main :is(h1, h2, h3, h4, h5, h6, p, button, input, select, textarea, label, table) { font-family: var(--font-family); }
/* Capas: barras SDN en 100–101. Modales y velos de la pantalla deben usar z-index ≥ 200 para cubrirlas. */

/* ===== Estilos de la pantalla ===== */
/* EDT · Expediente digital del trabajador — estilos de pantalla (solo tokens Cartillas).
   Prefijo "s-" para no chocar con las clases de gob.mx (.btn, .table, .badge, .alert…). */

.s-app { box-sizing: border-box; max-width: 1440px; margin: 0 auto; padding: var(--space-4) var(--space-6) var(--space-6);
  font-family: var(--font-family); font-size: var(--font-size-sm); line-height: 1.3; color: var(--color-neutral-700); }
.s-app *, .s-app *::before, .s-app *::after { box-sizing: border-box; }
.s-app :is(h1, h2, h3, h4, p) { margin: 0; font-family: var(--font-family); }
.s-app a { color: var(--color-primary-600); }
.s-app a:hover { color: var(--color-primary-800); }
.s-app :focus-visible { outline: 2px solid var(--color-primary-700); outline-offset: 2px; }
.s-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.s-num { font-variant-numeric: tabular-nums; }

/* Ruta */
.s-ruta ol { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); margin: 0 0 var(--space-2); padding: 0; list-style: none;
  font-size: var(--font-size-xs); line-height: 1.4; color: var(--color-neutral-600); }
.s-ruta li { display: flex; align-items: center; gap: var(--space-2); }
.s-ruta li + li::before { content: "/"; color: var(--color-neutral-500); }
.s-ruta a { color: var(--color-primary-600); text-decoration: none; }
.s-ruta a:hover { text-decoration: underline; }
.s-ruta [aria-current] { font-weight: var(--font-weight-semibold); color: var(--color-neutral-700); }

/* Encabezado y periodo */
.s-encabezado { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3) var(--space-4); margin-bottom: var(--space-4); }
.s-titulo { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3); }
.s-titulo h1 { font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); line-height: 1.25; color: var(--color-neutral-800); }
.s-titulo__meta { font-size: var(--font-size-sm); color: var(--color-neutral-600); }
.s-periodo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.s-periodo__fechas { margin-left: var(--space-2); font-size: var(--font-size-sm); color: var(--color-neutral-700); white-space: nowrap; }
.s-periodo__fechas strong { font-weight: var(--font-weight-semibold); }

/* Campos y controles */
.s-field { display: flex; flex-direction: column; gap: var(--space-1); width: 240px; max-width: 100%; }
.s-field--busqueda { width: 335px; }
.s-field--ord { width: 240px; }
.s-field label { font-size: var(--font-size-xs); line-height: 1; color: var(--color-neutral-700); }
.s-control { position: relative; display: inline-flex; width: 100%; }
.s-control--auto { width: auto; }
.s-control__icono { position: absolute; top: 50%; width: 24px; height: 24px; transform: translateY(-50%); color: var(--color-neutral-600); pointer-events: none; }
.s-control__icono--der { right: 10px; }
.s-control__icono--izq { left: 12px; }
.s-select { width: 100%; height: 40px; padding: 6px 36px 6px 12px; border: 2px solid var(--color-neutral-100); border-radius: var(--radius-sm);
  background: var(--color-surface); appearance: none; font-family: var(--font-family); font-size: var(--font-size-sm); line-height: 18px; color: var(--color-neutral-700); cursor: pointer; }
.s-select:hover { border-color: var(--color-neutral-200); }
.s-input { width: 100%; height: 40px; padding: 6px 12px 6px 40px; border: 2px solid var(--color-neutral-100); border-radius: var(--radius-sm);
  background: var(--color-surface); font-family: var(--font-family); font-size: var(--font-size-sm); line-height: 18px; color: var(--color-neutral-700); }
.s-input::placeholder { color: var(--color-neutral-500); }
.s-input:hover { border-color: var(--color-neutral-200); }

/* Botones */
.s-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 8px 20px; border: 0;
  border-radius: var(--radius-md); background: transparent; font-family: var(--font-family); font-size: var(--font-size-sm); font-weight: var(--font-weight-regular);
  line-height: 18px; text-decoration: none; white-space: nowrap; cursor: pointer; }
.s-btn svg { width: 20px; height: 20px; flex: none; }
.s-btn:disabled { cursor: not-allowed; }
.s-btn--filled { background: var(--color-primary-500); color: var(--color-surface); }
.s-btn--filled:hover, .s-btn--filled:active { background: var(--color-primary-700); color: var(--color-surface); }
.s-btn--outlined { background: var(--color-surface); color: var(--color-primary-500); box-shadow: inset 0 0 0 1px var(--color-primary-500); }
.s-btn--outlined:hover, .s-btn--outlined:active { background: var(--color-primary-50); color: var(--color-primary-500); }
.s-btn--outlined:focus-visible { box-shadow: inset 0 0 0 1px var(--color-primary-200); outline: 2px solid var(--color-primary-700); outline-offset: 2px; }
.s-btn--text { color: var(--color-primary-500); }
.s-btn--text:hover, .s-btn--text:active { background: var(--color-primary-50); color: var(--color-primary-500); }
.s-btn--text:focus-visible { box-shadow: inset 0 0 0 1px var(--color-primary-300); outline: 2px solid var(--color-primary-700); outline-offset: 2px; }
.s-btn-icono { display: inline-grid; place-content: center; width: 40px; height: 40px; padding: 0; border: 0; background: transparent; color: var(--color-primary-500); cursor: pointer; }
.s-icono-caja { display: grid; place-content: center; width: 24px; height: 24px; padding: 2px; border-radius: var(--radius-md); background: var(--color-surface);
  box-shadow: inset 0 0 0 1px var(--color-primary-500), var(--shadow-sm); }
.s-icono-caja svg { width: 20px; height: 20px; }
.s-btn-icono:hover .s-icono-caja { background: var(--color-primary-50); }
.s-btn-icono:focus-visible { outline: 2px solid var(--color-primary-700); outline-offset: -4px; border-radius: var(--radius-md); }
.s-btn-icono:disabled { cursor: not-allowed; color: var(--color-neutral-500); }
.s-btn-icono:disabled .s-icono-caja { background: var(--color-surface); box-shadow: inset 0 0 0 1px var(--color-neutral-100), var(--shadow-sm); }
.s-chip__quitar { display: inline-grid; place-content: center; width: 40px; height: 40px; margin: -10px -10px -10px 0; padding: 0; border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--color-neutral-700); font-size: var(--font-size-md); cursor: pointer; }
.s-chip__quitar:hover { background: var(--color-primary-50); }

/* Filtros (arriba de indicadores; afectan a todo) */
.s-filtros { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-4); padding: var(--space-4); background: var(--color-surface);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.s-filtros__campos { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3) var(--space-4); }
.s-chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.s-chip { display: inline-flex; align-items: center; gap: var(--space-1); padding-left: 12px; border-radius: var(--radius-pill); background: var(--color-primary-50);
  box-shadow: inset 0 0 0 1px var(--color-primary-200); font-size: var(--font-size-xs); line-height: 1.3; color: var(--color-primary-800); }

/* Indicadores */
.s-seccion { margin-top: var(--space-6); }
.s-seccion__cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-3); }
.s-seccion__h { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); line-height: 1.3; color: var(--color-neutral-800); }
.s-pill { display: inline-flex; align-items: center; max-width: 100%; min-height: 22px; white-space: normal; text-align: left; height: auto; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--color-sage-100);
  font-size: var(--font-size-2xs); font-weight: var(--font-weight-medium); line-height: 11px; color: var(--color-sage-800); white-space: nowrap; }
.s-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-sm); }
.s-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
.s-kpis--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.s-kpi { display: flex; flex-direction: column; gap: var(--space-3); }

.s-kpi__icono { display: grid; place-content: center; flex: none; width: 34px; height: 34px; border-radius: var(--radius-lg); background: var(--color-primary-50); color: var(--color-primary-600); }

.s-desglose { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2) var(--space-3); margin: 0; padding-top: var(--space-3); border-top: 1px solid var(--color-neutral-100); }
.s-dato { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* Tags de cumplimiento (siempre con texto %) */

.s-tag--medio { background: var(--color-pollen-200); color: var(--color-pollen-800); }
.s-tag--bajo { background: var(--color-rust-100); color: var(--color-rust-500); }
.s-tag--activo { background: var(--color-sage-100); color: var(--color-sage-900); }

/* Listas (reemplazan tablas en médicos y entidades) */
.s-lista__barra { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
.s-lista__cab { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, .8fr); gap: var(--space-4); padding: 0 var(--space-4) var(--space-2);
  font-size: var(--font-size-xs); color: var(--color-neutral-600); }
.s-lista { margin: 0; padding: 0; list-style: none; background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }

.s-fila__dato { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.s-bloque__col { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }

.s-bloque__pie { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-neutral-100); }
.s-bloque__barra { flex: 1 1 160px; }
.s-bloque__meta { font-size: var(--font-size-xs); color: var(--color-neutral-700); }

  .s-bloque__col--plan { padding-left: 0; border-left: 0; padding-top: var(--space-3); border-top: 1px solid var(--color-neutral-100); }

}


.s-grupo { margin-top: var(--space-6); }
.s-grupo__h { margin-bottom: var(--space-3); font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); line-height: 1.3; color: var(--color-neutral-800); }
.s-bloques { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.s-bloques > :only-child { grid-column: 1 / -1; }
.s-bloque { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); }

.s-icono-circ--prod { background: var(--color-primary-500); }
.s-icono-circ--personal { background: var(--color-sky-500); }
.s-icono-circ--infra { background: var(--color-lavender-600); }
.s-bloque__titulo { font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); line-height: 1.3; color: var(--color-neutral-800); }

.s-bloque__duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.s-bloque__col { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.s-bloque__col--plan { padding-left: var(--space-4); border-left: 1px solid var(--color-neutral-100); }
.s-bloque__etq { font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); line-height: 1.3; color: var(--color-neutral-600); }
.s-bloque__valor { font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); line-height: 1.1; color: var(--color-neutral-800); }

/* Seleccionada: Cartillas pide fondo #F0FDF9 y texto primary-400; sin token exacto se usa primary-50 y, por contraste, texto primary-700. */

/* Tarjetas de recurso (estilo del Resumen del SIH) */
.s-kpis--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* Tablas con orden y nombre como enlace */

@media (max-width: 1100px) { .s-kpis--3 { grid-template-columns: minmax(0, 1fr); } }

}

/* Correcciones de auditoría */

/* Panel lateral en Infraestructura y Plantilla (mismo patrón que Productividad) */

/* ===== Ficha del trabajador (estructura de la ficha SIPS) ===== */
.s-ficha2 { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: var(--space-6); padding: var(--space-5); margin-bottom: var(--space-6); }

.s-ficha2__fila { display: flex; align-items: flex-start; gap: var(--space-4); }

.s-ficha2__campos--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

/* Notas, capacitación, ausentismos, horas extras y trayectoria */
.s-ficha2__bloques { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-6); align-items: start; margin-top: var(--space-6); }

.s-ficha2__par { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr); gap: var(--space-6); }
.s-tarjeta { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }

.s-tarjeta__pares dt { font-size: var(--font-size-sm); color: var(--color-neutral-600); }

.s-trayectoria__lista li { padding: var(--space-3) var(--space-4); border: 1px solid var(--color-neutral-100); border-radius: var(--radius-md); background: var(--color-surface-alt); }
.s-trayectoria__lista dl { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.1fr) minmax(0, .9fr) minmax(0, 1.4fr); gap: var(--space-3); margin: 0; }

@media (max-width: 1100px) {

}

@media (max-width: 1100px) { .s-ficha2__campos--6 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }

/* ===== Menú lateral de secciones (Todo el país, OOAD, UMAE, Personal) ===== */
.s-app { display: flex; align-items: flex-start; gap: var(--space-6); }
.s-contenido { flex: 1; min-width: 0; }
.s-nav { position: sticky; top: var(--space-4); flex: 0 0 232px; width: 232px; padding: var(--space-3); background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); transition: width .2s ease; }
.s-nav__colapsar { display: inline-grid; place-content: center; width: 40px; height: 40px; margin: 0 0 var(--space-2) auto; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-neutral-600); cursor: pointer; }

.s-nav__item { display: flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: 8px; border-radius: var(--radius-sm); font-size: var(--font-size-sm); line-height: 18px; color: var(--color-neutral-700); text-decoration: none; }
.s-nav__item svg { width: 24px; height: 24px; flex: none; }
.s-nav__item:hover { background: var(--color-neutral-50); color: var(--color-neutral-800); }
.s-nav__item:focus-visible { outline: 2px solid var(--color-primary-700); outline-offset: -2px; }
.s-nav__item[aria-current="page"] { background: var(--color-primary-50); color: var(--color-primary-700); font-weight: var(--font-weight-semibold); }
.s-nav-abrir, .s-nav-fondo { display: none; }

/* Colapsado: solo íconos; la etiqueta se queda para lectores de pantalla */
.s-app--colapsado .s-nav { flex-basis: 72px; width: 72px; }
.s-app--colapsado .s-nav__colapsar { margin-left: 0; }
.s-app--colapsado .s-nav__item { justify-content: center; padding: 8px 0; }
.s-app--colapsado .s-nav__etq { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Pantallas chicas: cajón que se abre desde un botón */
@media (max-width: 1099px) {
  .s-app { display: block; }
  .s-nav { position: fixed; top: calc(var(--sdn-header-gob-height, 80px) + var(--sdn-user-bar-height, 54px)); bottom: 0; left: 0; z-index: 200; width: 264px; flex: none; max-width: 85vw; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; overflow-y: auto; transform: translateX(-100%); transition: transform .2s ease; }
  .s-app--nav-abierto .s-nav { transform: none; }
  .s-nav__colapsar { display: none; }
  .s-app--colapsado .s-nav { width: 264px; }
  .s-app--colapsado .s-nav__etq { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
  .s-app--colapsado .s-nav__item { justify-content: flex-start; padding: 8px; }
  .s-nav-abrir { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 40px; margin-bottom: var(--space-3); padding: 8px 12px; border: 0; border-radius: var(--radius-sm); background: var(--color-surface); box-shadow: var(--shadow-sm); color: var(--color-primary-700); font-family: var(--font-family); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); cursor: pointer; }
  .s-nav-abrir svg { width: 24px; height: 24px; }
  .s-nav-abrir:focus-visible { outline: 2px solid var(--color-primary-700); outline-offset: 2px; }
  .s-app--nav-abierto .s-nav-fondo { position: fixed; inset: 0; z-index: 199; display: block; }
  .s-nav-fondo::before { content: ""; position: absolute; inset: 0; background: var(--color-neutral-900); opacity: .4; }
}

/* Menú pegado al borde izquierdo: sin margen, sin radio y a todo el alto disponible */
.s-app { max-width: none; margin: 0; padding: 0; gap: 0; align-items: stretch; }
.s-nav { position: sticky; top: calc(var(--sdn-header-gob-height, 80px) + var(--sdn-user-bar-height, 54px)); align-self: flex-start; height: calc(100vh - var(--sdn-header-gob-height, 80px) - var(--sdn-user-bar-height, 54px)); overflow-y: auto; padding: var(--space-3) var(--space-2); border-radius: 0; box-shadow: none; border-right: 1px solid var(--color-neutral-100); }
.s-contenido { max-width: 1208px; padding: var(--space-4) var(--space-6) var(--space-6); }
@media (max-width: 1099px) {
  .s-app { display: block; }
  .s-nav { height: auto; border-right: 0; }
  .s-contenido { max-width: none; padding: var(--space-3); }
}

/* ===== Tarjeta «Más lejos de la meta» ===== */
.s-rank { margin-top: var(--space-4); padding: var(--space-4) var(--space-5); }
.s-rank__cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3) var(--space-5); margin-bottom: var(--space-3); }

.s-rank__fila { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, .6fr); align-items: center; gap: var(--space-4); min-height: 56px; padding: var(--space-2) var(--space-2); border-bottom: 1px solid var(--color-neutral-100); color: inherit; text-decoration: none; border-radius: var(--radius-sm); }

@media (max-width: 640px) {

/* ===== Panel lateral en la misma fila que la tabla (no la tapa) ===== */
@media (min-width: 1100px) {

}

/* ===== Animación del panel lateral ===== */
@keyframes s-drawer-entra { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes s-drawer-sale { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(28px); } }
@keyframes s-drawer-sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.s-drawer { animation: s-drawer-entra .32s cubic-bezier(.2, .7, .2, 1) both; }
.s-drawer--sale { animation: s-drawer-sale .22s ease-in both; pointer-events: none; }
.s-drawer--sin-entrada, .s-drawer--sin-entrada > .s-drawer__cuerpo > *, .s-drawer--sin-entrada > .s-drawer__cab { animation: none; }
.s-drawer > .s-drawer__cab { animation: s-drawer-sube .3s cubic-bezier(.2, .7, .2, 1) .05s both; }
.s-drawer > .s-drawer__cuerpo > * { animation: s-drawer-sube .34s cubic-bezier(.2, .7, .2, 1) both; }
.s-drawer > .s-drawer__cuerpo > :nth-child(2) { animation-delay: .08s; }
.s-drawer > .s-drawer__cuerpo > :nth-child(3) { animation-delay: .14s; }
.s-drawer > .s-drawer__cuerpo > :nth-child(4) { animation-delay: .2s; }
.s-drawer > .s-drawer__cuerpo > :nth-child(n+5) { animation-delay: .26s; }
@media (prefers-reduced-motion: reduce) {
  .s-drawer, .s-drawer--sale, .s-drawer > .s-drawer__cab, .s-drawer > .s-drawer__cuerpo > * { animation: none !important; }
}
.s-rank__fila--fija { cursor: default; }
.s-rank__fila--fija:hover { background: transparent; }
.s-niveles .s-rank__fila { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .6fr); }
button.s-rank__fila { width: 100%; border: 0; background: transparent; font: inherit; text-align: left; cursor: pointer; }
button.s-rank__fila:hover { background: var(--color-neutral-50); }
button.s-rank__fila:focus-visible { outline: 2px solid var(--color-primary-700); outline-offset: -2px; }
.s-ind__pct { margin-top: 2px; }
.s-ind__pct .s-tag { font-size: var(--font-size-2xs); }
/* Desglose por tipo debajo de cada fila de productividad, alineado con el texto */
.s-ind--apilado { flex-wrap: wrap; row-gap: var(--space-2); }
.s-ind--apilado .s-ind__subs { flex-basis: 100%; padding-left: 52px; }

/* ===== Tarjetas de Infraestructura y Personal (formato de referencia) ===== */
.s-panel--infra { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-4) var(--space-6); }
.s-panel--infra .s-ind { flex: 0 0 auto; }
.s-infra__datos { display: flex; flex-wrap: wrap; gap: var(--space-5) var(--space-6); position: relative; z-index: 2; }
.s-infra__dato { display: flex; flex-direction: column; gap: 2px; min-width: 96px; padding: 4px 8px; border: 0; border-radius: var(--radius-sm); background: transparent; text-align: left; font-family: var(--font-family); cursor: pointer; }
.s-infra__dato:hover { background: var(--color-surface); }
.s-infra__dato:focus-visible { outline: 2px solid var(--color-primary-700); outline-offset: 2px; }
.s-infra__etq { font-size: var(--font-size-sm); color: var(--color-neutral-600); }
.s-infra__val { font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); color: var(--color-lavender-600); }
.s-panel--personal .s-ind__filas .s-ind__subs dd { font-size: var(--font-size-xl); }
.s-ind--real .s-ind__subs dd, .s-ind--plan .s-ind__subs dd { font-size: var(--font-size-xl); }

/* ===== Estructura usable: título arriba, datos abajo en cuadrícula, sin amontonar ni dejar aire ===== */
/* Productividad acumulada: dos columnas iguales (real | planeada), cada una con su total y sus desgloses */
.s-panel--prod .s-ind__filas { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: var(--space-5); align-items: stretch; }
.s-panel--prod .s-ind__filas > .s-ind__sep { width: 1px; align-self: stretch; background: var(--color-teal-500); }
.s-ind--apilable { flex-wrap: wrap; align-items: center; row-gap: var(--space-3); }
.s-ind--apilable .s-ind__subs { flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 200px)); justify-content: start; gap: var(--space-3) var(--space-6); margin: 0; padding-left: 52px; }
.s-ind--apilable .s-ind__subs > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
/* Infraestructura: título arriba, tres datos en columnas iguales */
.s-panel--infra { display: flex; flex-direction: column; align-items: stretch; gap: var(--space-4); }
.s-infra__datos { display: grid; grid-template-columns: repeat(3, minmax(0, 200px)); justify-content: start; gap: var(--space-4) var(--space-6); }
.s-infra__dato { min-width: 0; }
/* Pantallas angostas: columnas se apilan */
@container (max-width: 900px) {
  .s-panel--prod .s-ind__filas { grid-template-columns: minmax(0, 1fr); }
  .s-panel--prod .s-ind__filas > .s-ind__sep { display: none; }
  .s-panel--prod .s-ind__filas > .s-ind--plan { padding-top: var(--space-3); border-top: 1px solid var(--color-teal-100); }
}
@media (max-width: 640px) {
  .s-infra__datos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .s-ind--apilable .s-ind__subs { padding-left: 0; }
}

.s-panel--personal .s-ind { align-items: center; }
.s-panel--personal .s-ind__subs { gap: var(--space-6); }

  </style>

  function listado(idv, v, items, o) {

        const filas = pag.length ? pag.map(it => o.medico ? filaMedico(it, idv, v, true) : filaEntidad(it)).join('') : '<li class="s-vacio">Sin resultados con los filtros actuales.</li>';

  function tendencia(items) {

  /* Panel lateral de Infraestructura y Plantilla: mismo componente y CTA que el de Productividad */
  const RECURSO = { cama: ['Camas censables', 'cam', 'hpc', 'Hospitalización por cama'], quir: ['Quirófanos', 'qui', 'cpq', 'Cirugías por quirófano al día'], cons: ['Consultorios', 'con', 'cpc', 'Consultas por consultorio al día'] };
  function tendenciaUso(nodos) {

  /* El panel solo muestra lo que la fila o la tarjeta no muestra: el desglose de los agregados (médicos y otras categorías) */
  const DESGLOSE = ['ME', 'MF', 'OM', 'AD', 'LI', 'PA', 'TE'];
  function tablaPlantilla(pl) {

  function ranking(titulo, filas, fmtVal) {
    return `<section class="s-drawer__bloque"><h3>${titulo}</h3>${filas.length
      ? `<ol class="s-top">${filas.map(x => `<li><a href="#/e/${x.n.id}?tab=${ctx.tema}">${esc(x.n.nombre)}</a><span class="s-num">${fmtVal(x.v)}</span></li>`).join('')}</ol>`

  }
  function drawerTema(d) {
    let titulo, sub = 'Semana ' + ui.semana + ' · ' + rangoSemana(ui.semana).corto, cuerpo = '';
    if (d.k === 't-fila') {
      const n = ctx.temaNodos.find(x => x.id === d.id); if (!n) { ui.drawer = null; return ''; }
      titulo = n.nombre;
      cuerpo = (ctx.tema === 'infra' ? tendenciaUso([n]) : tablaPlantilla(plantilla(n)))
        + bloqueProd(n) + `<a class="s-btn s-btn--outlined" href="#/e/${n.id}?tab=${ctx.tema}">${I.doc}Abrir detalle</a>`;
    } else if (ctx.tema === 'infra' && RECURSO[d.id]) {
      const [t, , i, etq] = RECURSO[d.id], nodos = ctx.temaNodos;
      titulo = t; cuerpo = tablaRecurso(d.id, nodos);
      if (ctx.temaHijos) cuerpo += ranking(`Menor uso: ${etq.toLowerCase()}`, nodos.map(n => ({ n, v: usoDe([n], ui.semana)[i] })).filter(x => x.v != null).sort((a, b) => a.v - b.v).slice(0, TOP), fmt1);
    } else if (ctx.tema === 'plant' && d.id === 'pl') {
      const nodos = ctx.temaNodos;
      titulo = 'Plantilla'; cuerpo = tablaPlantilla(plantillaDe(nodos));
      if (ctx.temaHijos) cuerpo += ranking('Menos atenciones por médico', nodos.map(n => { const p = plantilla(n); return { n, v: p.medicos ? usoDe([n], ui.semana).at / p.medicos : null }; }).filter(x => x.v != null).sort((a, b) => a.v - b.v).slice(0, TOP), fmt1);

      <header class="s-drawer__cab"><div><h2 id="drawer-titulo" tabindex="-1">${esc(titulo)}</h2><p>${esc(sub)}</p></div>
        <button class="s-btn-icono" type="button" id="drawer-cerrar" data-cerrar aria-label="Cerrar detalle"><span class="s-icono-caja">${I.cerrar}</span></button></header>
      <div class="s-drawer__cuerpo">${cuerpo}</div></aside>`;
  }
  function drawer() {
    if (ui.drawer && ui.drawer.k === 't-pers') { const n = nodos[ui.drawer.id]; if (n) return drawerPersona(n); ui.drawer = null; return ''; }
    if (ui.drawer && ui.drawer.k.startsWith('t-')) return ctx.tema ? drawerTema(ui.drawer) : '';
    const d = ui.drawer; if (!d || !ctx.agg) return '';
    let titulo, sub, m, it = null, set = ctx.items;
    if (d.k === 'sem') { titulo = 'Semana ' + ui.semana; sub = rangoSemana(ui.semana).corto; m = ctx.agg.sem; }
    else if (d.k === 'acu') { titulo = 'Acumulado'; sub = `Semanas 1 a ${ui.semana}`; m = ctx.agg.acu; }
    else {

      titulo = it.nombre; sub = 'Semana ' + ui.semana + ' · ' + rangoSemana(ui.semana).corto; m = it.m; set = [it];

    const fila = (n, r, pl) => { const pct = pl ? Math.round(r / pl * 100) : null; return `<tr><td>${n}</td><td class="s-der s-num">${fmt(r)}</td><td class="s-der s-num">${pl == null ? 'Sin meta' : fmt(pl)}</td><td class="s-der">${pct == null ? 'Sin meta' : tagCump(pct)}</td></tr>`; };
    const porTipo = (n, r, pl) => { const pct = pl ? Math.round(r / pl * 100) : null, falta = pl - r; return `<tr><td>${n}</td><td class="s-der">${pct == null ? 'Sin meta' : tagCump(pct)}</td><td class="s-der s-num">${pl == null ? '—' : (falta > 0 ? `<span class="s-brecha">Faltan ${fmt(falta)}</span>` : 'Cumple')}</td></tr>`; };

      ? `<div class="s-tabla-scroll" role="region" aria-label="Cumplimiento por tipo de atención" tabindex="0"><table class="s-tabla"><caption class="s-sr">Cumplimiento por tipo de atención</caption>
      <thead><tr><th scope="col">Atención</th><th scope="col" class="s-der">Cumplimiento</th><th scope="col" class="s-der">Faltan</th></tr></thead>
      <tbody>${porTipo('Consultas', m.cr, m.cp)}${porTipo('Cirugías', m.qr, m.qp)}</tbody></table></div>
      <section class="s-drawer__bloque"><h3>Atenciones sin meta</h3><div class="s-tabla-scroll" role="region" aria-label="Atenciones sin meta" tabindex="0"><table class="s-tabla"><caption class="s-sr">Urgencias y hospitalización, real de la semana</caption>
      <thead><tr><th scope="col">Atención</th><th scope="col" class="s-der">Real</th></tr></thead>
      <tbody>${sinMeta('Urgencias', m.ur)}${sinMeta('Hospitalización', m.hr)}</tbody></table></div></section>`
      : `<div class="s-tabla-scroll" role="region" aria-label="Real frente a planeado" tabindex="0"><table class="s-tabla"><caption class="s-sr">Real frente a planeado por tipo de atención</caption>
      <thead><tr><th scope="col">Atención</th><th scope="col" class="s-der">Real</th><th scope="col" class="s-der">Planeado</th><th scope="col" class="s-der">Cumplimiento</th></tr></thead>
      <tbody>${fila('Consultas', m.cr, m.cp)}${fila('Cirugías', m.qr, m.qp)}${fila('Urgencias', m.ur, null)}${fila('Hospitalización', m.hr, null)}</tbody></table></div>`;
    let extra;
    const datosMed = it && it.n.tipo === 'medico' ? (() => { const e = expediente(it.n); return `<p class="s-drawer__dato">${esc(estatusMedico(it.n))} · ${esc(e.turno)} · Categoría contractual: ${esc(e.categoria)}</p>`; })() : '';
    if (it) extra = `<a class="s-btn s-btn--outlined" href="#/e/${it.id}">${I.doc}Abrir ${it.n.tipo === 'medico' ? 'expediente' : 'detalle'}</a>`;

        ? `<ol class="s-top">${top.map(x => `<li><a href="#/e/${x.id}">${esc(x.nombre)}</a><span class="s-num s-brecha">Faltan ${fmt(x.brecha)}</span></li>`).join('')}</ol>`

  }

  /* Detalle del médico */
  /* ===== Integración SIH: infraestructura y plantilla por nivel (sin equipos) ===== */
  const DIAS_SEMANA = 5;
  const fmt1 = n => n == null ? '—' : n.toLocaleString('es-MX', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  /* Catálogo de categorías del SIH. MF, ME y OM son los médicos que mide el EDT. */
  const CATEGORIAS = [['AD', 'Administrativas'], ['EN', 'Enfermeras'], ['LI', 'Limpieza e higiene'], ['ME', 'Médicos especialistas'], ['MF', 'Médicos familiares'],
    ['OM', 'Otros médicos'], ['PA', 'Paramédicos'], ['RE', 'Residentes'], ['TE', 'Técnicos']];
  const ORDEN_PERSONAS = ['MF', 'ME', 'OM', 'RE', 'EN', 'PA', 'TE', 'AD', 'LI'];
  const ESTATUS = ['Activo', 'Activo', 'Activo', 'Activo', 'Activo', 'Activo', 'Activo', 'Vacaciones', 'Incapacidad', 'Licencia'];
  /* Un solo estatus por médico: lo comparten la tabla de personal y el expediente */
  function estatusMedico(mm) { const e = expediente(mm); if (!e.estatus) e.estatus = elegir(rng('st|' + mm.id), ESTATUS); return e.estatus; }
  const NOMBRE_CAT = Object.fromEntries(CATEGORIAS);
  const CAT_MEDIDAS = ['MF', 'ME', 'OM'];
  const TURNOS = ['Matutino', 'Matutino', 'Vespertino', 'Nocturno', 'Jornada acumulada'];
  const CONTRACTUAL = { RE: 'Médico residente', EN: 'Enfermera general', PA: 'Paramédico', TE: 'Técnico en salud', AD: 'Auxiliar administrativo', LI: 'Auxiliar de servicios de intendencia' };
  const JORNADAS = { Matutino: '07:00 a 15:00', Vespertino: '14:00 a 22:00', Nocturno: '21:00 a 07:00', 'Jornada acumulada': 'Sáb, dom y festivos' };
  const TEMAS = [['prod', 'Productividad', 'pulso'], ['infra', 'Infraestructura', 'hospital'], ['plant', 'Plantilla', 'personas']];

  function catMedicoArea(a) { return a.nombre === 'Medicina familiar' ? 'MF' : /Urgencias|continua/.test(a.nombre) ? 'OM' : 'ME'; }
  function plantilla(n) {
    if (n._pl) return n._pl;
    const t = Object.fromEntries(CATEGORIAS.map(([k]) => [k, 0]));
    if (n.tipo === 'area') {
      const r = rng('pl|' + n.id), m = n.medicos;
      t[catMedicoArea(n)] = m;
      t.RE = n.umf ? 0 : Math.round(m * entre(r, .05, .2));
      t.EN = n.enfermeria || 0;
      t.PA = Math.round(m * entre(r, .1, .25)); t.TE = Math.round(m * entre(r, .15, .4));
      t.AD = Math.round(m * entre(r, .3, .6)); t.LI = Math.round(m * entre(r, .2, .4));
    } else {
      (n.tipo === 'nacional' ? RAICES : hijos(n)).forEach(h => { const p = plantilla(h); CATEGORIAS.forEach(([k]) => { t[k] += p[k]; }); });
    }
    return (n._pl = completar(t));
  }
  function completar(t) {
    t.total = CATEGORIAS.reduce((s, [k]) => s + t[k], 0);
    t.medicos = CAT_MEDIDAS.reduce((s, k) => s + t[k], 0);
    t.otras = t.total - t.medicos - t.RE - t.EN;
    return t;
  }
  function plantillaDe(nodos) {
    const t = Object.fromEntries(CATEGORIAS.map(([k]) => [k, 0]));
    nodos.forEach(h => { const p = plantilla(h); CATEGORIAS.forEach(([k]) => { t[k] += p[k]; }); });
    return completar(t);
  }
  /* Uso de la capacidad: cruza la productividad del EDT con la infraestructura del SIH */
  function usoDe(nodos, w) {
    const t = { cam: 0, qui: 0, con: 0, cr: 0, qr: 0, hr: 0, at: 0 };
    nodos.forEach(h => {
      t.cam += h.camas || 0; t.qui += h.quirofanos || 0; t.con += h.consultorios || 0;
      const m = metricas(h, w); t.cr += m.cr; t.qr += m.qr; t.hr += m.hr; t.at += totalAt(m);
    });
    t.cpc = t.con ? t.cr / t.con / DIAS_SEMANA : null;
    t.cpq = t.qui ? t.qr / t.qui / DIAS_SEMANA : null;
    t.hpc = t.cam ? t.hr / t.cam : null;
    return t;
  }

  function pestanasTema(idv, actual) {
    return `<div class="s-subtabs" role="tablist" aria-label="Tema de consulta">${TEMAS.map(([k, t, ic]) => `<button class="s-subtab" type="button" role="tab" id="tab-${idv}-${k}" data-vista="${idv}" data-tab="${k}" aria-selected="${k === actual}" aria-controls="panel-${idv}" tabindex="${k === actual ? 0 : -1}">${I[ic]}<span>${t}</span></button>`).join('')}</div>`;
  }
  function conTema(idv, v, cab, cuerpo) {

  }
  function temaValido(v) { if (!TEMAS.some(([k]) => k === v.tab)) v.tab = 'prod'; return v.tab; }

  function thOrden(idv, v, campo, k, texto, der) {
    const o = v[campo], act = o.k === k, aria = act ? (o.dir > 0 ? 'ascending' : 'descending') : 'none';
    return `<th scope="col" class="s-th-ord${der ? ' s-der' : ''}" aria-sort="${aria}"><button class="s-lista__ord${act ? ' is-activa' : ''}" type="button" id="ord-${idv}-${campo}-${k}" data-ordenar="${idv}" data-campo-orden="${campo}" data-k="${k}">${texto}<span class="s-lista__chev" aria-hidden="true">${I.ordenar}</span></button></th>`;
  }
  function paginar(v, filas) { const pags = Math.max(1, Math.ceil(filas.length / POR_PAGINA)); if (v.pagina > pags) v.pagina = pags; return filas.slice((v.pagina - 1) * POR_PAGINA, v.pagina * POR_PAGINA); }
  function botonTema(h, sub) {
    const sel = ui.drawer && ui.drawer.k === 't-fila' && ui.drawer.id === h.id;
    return `<button class="s-fila__abrir" type="button" id="dr-${h.id}" data-drawer="t-fila" data-id="${h.id}" aria-pressed="${!!sel}"><span class="s-fila__nombre">${esc(h.nombre)}</span>${sub ? `<span class="s-fila__sub">${esc(sub)}</span>` : ''}</button>`;
  }
  function celdaNombre(h, tema, sub) {
    return `<a class="s-celda-nombre" href="#/e/${h.id}?tab=${tema}"><span class="s-celda-nombre__t">${esc(h.nombre)}</span>${sub ? `<span class="s-celda-nombre__s">${esc(sub)}</span>` : ''}</a>`;
  }
  const subEntidad = h => [h.estado, h.titular].filter(Boolean).join(' · ');

  /* ---------- Infraestructura ---------- */
  function tarjetaRecurso(clase, icono, etiq, valor, usoEtq, usoVal, sinUso) {
    const sel = ui.drawer && ui.drawer.k === 't-res' && ui.drawer.id === clase;
    return `<article class="s-card s-recurso s-recurso--${clase}"><button class="s-bloque__abrir" type="button" id="card-${clase}" data-drawer="t-res" data-id="${clase}" aria-pressed="${!!sel}" aria-label="Ver detalle de ${etiq}"></button><header class="s-recurso__cab"><span class="s-recurso__icono" aria-hidden="true">${icono}</span><h3 class="s-recurso__titulo">${etiq}</h3></header>
      <p class="s-recurso__valor s-num">${fmt(valor)}</p>
      <p class="s-recurso__uso">${usoVal == null ? esc(sinUso) : `<strong class="s-num">${fmt1(usoVal)}</strong> ${usoEtq}`}</p></article>`;

  function panelInfra(idv, v, nodos, o) {

  /* ---------- Plantilla ---------- */
  function graficaCategorias(pl) {

  function panelPlantilla(idv, v, nodos, o) {

      <div class="s-card s-tabla-card"><div class="s-tabla-scroll" role="region" aria-labelledby="t-${idv}" tabindex="0"><table class="s-tabla s-tabla--ord"><caption class="s-sr">${o.titulo}: plantilla y atenciones por médico en la semana ${ui.semana}</caption>

        <tbody>${cuerpo}</tbody></table></div></div>${paginacion(idv, v, ord.length)}</section>`;
  }
  /* Personas del servicio: médicos del EDT (con productividad) y resto de la plantilla del SIH (sin meta) */
  function personalArea(n) {
    if (n._pers) return n._pers;
    const k0 = catMedicoArea(n);
    const lista = hijos(n).map(mm => { const e = expediente(mm); return { med: mm, nombre: cap(mm.nombre), matricula: e.matricula, cat: k0, turno: e.turno, estatus: estatusMedico(mm), adsc: `${n.padre.nombre} · ${n.nombre}` }; });
    const pl = plantilla(n);
    ['RE', 'EN', 'PA', 'TE', 'AD', 'LI'].forEach(k => {
      for (let i = 0; i < pl[k]; i++) {
        const r = rng(`p|${n.id}|${k}|${i}`), p = persona(r), turno = elegir(r, TURNOS);
        const nodo = registrar({ id: `${n.id}.x${k}${i}`, tipo: 'persona', padre: n, persona: p, nombre: `${p.ap1} ${p.ap2} ${p.nombre}`, cat: k,
          _fijo: { matricula: String(10000000 + Math.floor(r() * 89999999)), categoria: CONTRACTUAL[k], turno, jornada: JORNADAS[turno], estatus: elegir(r, ESTATUS), cedula: ['AD', 'LI'].includes(k) ? 'No aplica' : String(1e7 + Math.floor(r() * 8.9e7)) } });
        lista.push({ med: null, nodo, nombre: cap(nodo.nombre), matricula: nodo._fijo.matricula, cat: k, turno, estatus: nodo._fijo.estatus, adsc: `${n.padre.nombre} · ${n.nombre}` });
      }
    });
    return (n._pers = lista);
  }
  function botonPersona(p) {
    const sel = ui.drawer && ui.drawer.k === 't-pers' && ui.drawer.id === p.nodo.id;
    return `<button class="s-fila__abrir" type="button" id="dr-${p.nodo.id}" data-drawer="t-pers" data-id="${p.nodo.id}" aria-pressed="${!!sel}"><span class="s-fila__nombre">${esc(p.nombre)}</span><span class="s-fila__sub s-num">Matrícula ${p.matricula}</span></button>`;
  }
  function drawerPersona(n) {

      <div class="s-drawer__cuerpo"><div class="s-tabla-scroll" role="region" aria-label="Datos del trabajador" tabindex="0"><table class="s-tabla s-tabla--datos"><caption class="s-sr">Datos del trabajador</caption><tbody>
        ${dato('Estatus', e.estatus)}${dato('Categoría', NOMBRE_CAT[n.cat])}${dato('Categoría contractual', e.categoria)}${dato('Turno', `${e.turno} · ${e.jornada}`)}${dato('Unidad', e.unidad.nombre)}${dato('Servicio', e.area.nombre)}${dato('Tipo de contratación', e.contrato)}${dato('Antigüedad', `${e.antig} años`)}${dato(`Ausentismo ${ANIO}`, `${e.ausProg + e.ausNoProg} días`)}

      <section class="s-drawer__bloque"><h3>Productividad</h3><p class="s-drawer__dato"><span class="s-sinmeta">Sin productividad medida</span></p></section>
      <a class="s-btn s-btn--outlined" href="#/e/${n.id}">${I.doc}Abrir expediente</a></div></aside>`;
  }
  function listaPersonal(idv, v, personas, titulo = 'Personal del servicio') {
    const o = v.ordenPer;
    const filas = personas.map(p => { const it = p.med ? item(p.med, ui.semana) : null; return Object.assign({}, p, { it, cump: it ? it.cump : null, brecha: it && it.plan > 0 ? it.brecha : null, orden: CATEGORIAS.findIndex(([k]) => k === p.cat) }); })
      .sort((a, b) => {
        if (o.k !== 'cat') { /* sin productividad medida, siempre al final */
          const x = a[o.k], y = b[o.k];
          if (x == null || y == null) { if (x != null) return -1; if (y != null) return 1; }
          else if (x !== y) return (x < y ? -1 : 1) * o.dir;
        }
        return (o.k === 'cat' ? o.dir : 1) * (a.orden - b.orden) || (a.cump ?? 999) - (b.cump ?? 999) || a.nombre.localeCompare(b.nombre, 'es');
      });
    const pag = paginar(v, filas);
    ui.conteo = filas.length;
    if (!ctx.agg) { ctx.items = personas.filter(p => p.med).map(p => item(p.med, ui.semana)); ctx.agg = { personas: true }; }
    const cuerpo = pag.length ? pag.map(p => `<tr><td>${p.med ? botonDrawer(ctx.items.find(x => x.id === p.med.id), `Matrícula ${p.matricula}`) : botonPersona(p)}</td>

      : '<tr><td colspan="9" class="s-vacio">Sin resultados con los filtros actuales.</td></tr>';
    return `<section class="s-seccion" aria-labelledby="t-${idv}">
      <div class="s-lista__barra"><h2 id="t-${idv}" class="s-seccion__h" tabindex="-1">${esc(titulo)} <span class="s-pill s-num">${fmt(filas.length)}</span></h2></div>
      <div class="s-card s-tabla-card"><div class="s-tabla-scroll" role="region" aria-labelledby="t-${idv}" tabindex="0"><table class="s-tabla s-tabla--ord"><caption class="s-sr">${esc(titulo)} con su cumplimiento en la semana ${ui.semana}</caption>
        <thead><tr><th scope="col">Personal / matrícula</th>${thOrden(idv, v, 'ordenPer', 'cat', 'Categoría')}<th scope="col">Estatus</th><th scope="col">Turno</th><th scope="col">Adscripción</th><th scope="col" class="s-der">Consultas</th><th scope="col" class="s-der">Cirugías</th>${thOrden(idv, v, 'ordenPer', 'cump', 'Cumplimiento semana ' + ui.semana)}${thOrden(idv, v, 'ordenPer', 'brecha', 'Faltan', 1)}</tr></thead>
        <tbody>${cuerpo}</tbody></table></div></div>${paginacion(idv, v, filas.length)}</section>`;
  }

  /* Vistas */
  /* Tarjeta «Más lejos de la meta»: 5 filas, con filtro de nivel y de estado. Vive solo en Todo el país. */
  const NIVELES_RANK = [['ooad', 'OOAD y UMAE'], ['unidad', 'Unidades'], ['servicio', 'Servicios']];
  function candidatosRank(nivel) {
    if (nivel === 'unidad') return RAICES.filter(h => h.tipo === 'ooad').flatMap(hijos);
    if (nivel === 'servicio') return RAICES.flatMap(h => hijos(h).flatMap(x => x.tipo === 'area' ? [x] : hijos(x)));
    return RAICES;
  }
  function tarjetaLejos(v) {
    const nivelSel = v.rnivel || 'ooad', est = v.estado || '';
    const base = candidatosRank(nivelSel).filter(h => !est || estadoDe(h) === est);
    const conMeta = base.map(h => item(h, ui.semana)).filter(it => it.plan > 0 && it.cump != null);
    const top = conMeta.slice().sort((a, b) => a.cump - b.cump || b.brecha - a.brecha).slice(0, 5);
    const padreTxt = h => h.tipo === 'ooad' || h.tipo === 'umae' ? '' : h.tipo === 'unidad' ? h.padre.nombre : h.padre.nombre;
    const filas = top.map(it => {
      const h = it.n, sub = [estadoDe(h), padreTxt(h)].filter(Boolean).join(' · ');
      return `<li><button class="s-rank__fila" type="button" data-drawer="fila" data-id="${h.id}">
        <span class="s-rank__nombre">${esc(h.nombre)}<span class="s-rank__sub">${esc(sub)}</span></span>
        <span class="s-rank__cump">${tagCump(it.cump)}<span class="s-barra s-barra--${nivel(it.cump)}" role="img" aria-label="Cumplimiento ${it.cump} %"><span style="width:${Math.min(100, it.cump)}%"></span></span></span>
        <span class="s-rank__falta s-num">${it.brecha > 0 ? `Faltan ${fmt(it.brecha)}` : 'Cumple'}</span></button></li>`;
    }).join('');
    return `<section class="s-card s-rank" aria-labelledby="t-rank">
      <div class="s-rank__cab"><div><h2 id="t-rank" class="s-seccion__h">Más lejos de la meta</h2>
        <p class="s-rank__sub">Semana ${ui.semana} · las 5 con menor cumplimiento${est ? ' · ' + esc(est) : ''} · ${fmt(conMeta.length)} con meta</p></div>
        <div class="s-rank__filtros">${selectCampo('N', 'rnivel', 'Nivel', NIVELES_RANK, nivelSel)}</div></div>
      ${top.length ? `<ol class="s-rank__lista">${filas}</ol>` : '<p class="s-vacio-bloque">Sin resultados con este filtro.</p>'}
    </section>`;
  }
  /* Tarjeta «Por nivel de atención»: una fila por nivel, con cumplimiento y faltante. Respeta el filtro de estado. */
  function tarjetaNiveles(titulo, nodos) {
    const g = { p1: { n: 0, real: 0, plan: 0 }, p2: { n: 0, real: 0, plan: 0 }, p3: { n: 0, real: 0, plan: 0 } };
    nodos.forEach(h => { const k = nivelDe(h); if (!k) return; const it = item(h, ui.semana); g[k].n++; g[k].real += it.real; g[k].plan += it.plan; });
    const filas = ['p1', 'p2', 'p3'].filter(k => g[k].n > 0).map(k => {
      const x = g[k], pct = x.plan ? Math.round(x.real / x.plan * 100) : null, falta = x.plan - x.real;
      const etq = k === 'p1' ? 'UMF' : k === 'p2' ? 'HGZ y HGR' : 'UMAE';
      return `<li class="s-rank__fila s-rank__fila--fija">
        <span class="s-rank__nombre">${NIVEL_LABEL[k]}<span class="s-rank__sub">${etq} · ${fmt(x.n)} ${k === 'p3' ? 'UMAE' : 'unidades'}</span></span>
        <span class="s-rank__cump">${pct == null ? '<span class="s-sinmeta">Sin meta</span>' : `${tagCump(pct)}<span class="s-barra s-barra--${nivel(pct)}" role="img" aria-label="Cumplimiento ${pct} %"><span style="width:${Math.min(100, pct)}%"></span></span>`}</span>
        <span class="s-rank__falta s-num">${pct == null ? '' : falta > 0 ? `Faltan ${fmt(falta)}` : 'Cumple'}</span></li>`;
    }).join('');
    return `<section class="s-card s-rank s-niveles" aria-labelledby="t-niv">
      <div class="s-rank__cab"><div><h2 id="t-niv" class="s-seccion__h">Por nivel de atención</h2>
        <p class="s-rank__sub">Semana ${ui.semana}${titulo ? ' · ' + esc(titulo) : ''}</p></div></div>
      <ol class="s-rank__lista">${filas}</ol>
    </section>`;
  }
  function vNacional() {
    const idv = 'N', v = vista(idv, { orden: { k: 'cump', dir: 1 } }), tipo = v.tipo, tema = temaValido(v);
    const etiq = { ooad: 'OOAD', umae: 'UMAE' }[tipo] || 'Todo el país';
    const estados = [...new Set(RAICES.filter(h => !tipo || h.tipo === tipo).map(h => h.estado))].sort((a, b) => a.localeCompare(b, 'es'));
    const q = norm(v.q.trim());
    const sel = RAICES.filter(h => (!tipo || h.tipo === tipo) && (!v.estado || h.estado === v.estado) && (!q || norm(`${h.nombre} ${h.titular} ${h.estado}`).includes(q)));
    const campos = selectCampo(idv, 'estado', 'Estado', [['', 'Todos'], ...estados.map(e => [e, e])], v.estado)
      + campoBuscar(idv, v, 'Buscar', 'Nombre, titular o estado');
    const act = [];
    if (v.estado) act.push(['estado', `Estado: ${v.estado}`]);
    if (v.q) act.push(['q', `Buscar: “${v.q}”`]);
    const titulo = tipo ? etiq : 'OOAD y UMAE';
    let cuerpo = barra(idv, campos, act);
    if (tema === 'prod') {
      const items = sel.map(h => item(h, ui.semana));
      const nodosNiv = [...(tipo === 'umae' ? [] : RAICES.filter(h => h.tipo === 'ooad' && (!v.estado || estadoDe(h) === v.estado)).flatMap(hijos)), ...(tipo === 'ooad' ? [] : RAICES.filter(h => h.tipo === 'umae' && (!v.estado || estadoDe(h) === v.estado)))];
      cuerpo += indicadores(items, titulo) + tarjetaNiveles(v.estado || (tipo ? etiq : ''), nodosNiv) + (tipo ? '' : tarjetaLejos(v)) + listado(idv, v, items, { titulo, etiqueta: 'Atención médica por ' + titulo, medico: false, columna: 'OOAD o UMAE' });
    } else if (tema === 'infra') cuerpo += panelInfra(idv, v, sel, { hijos: true, titulo: 'Capacidad por ' + titulo, columna: 'OOAD o UMAE', sub: subEntidad });
    else cuerpo += panelPlantilla(idv, v, sel, { hijos: true, titulo: 'Plantilla por ' + titulo, columna: 'OOAD o UMAE', sub: subEntidad });

  }
  /* Personal: solo por estado, para no cargar más de 100 000 médicos a la vez */
  function medicosDe(n) { return n.tipo === 'medico' ? [n] : hijos(n).flatMap(medicosDe); }

  function vPersonal() {

  function vOoad(n) {

  function vUnidad(n) {

  function vArea(n) {

  function grafica(sem) {

  /* Ficha del trabajador (estructura de la ficha SIPS): datos generales y laborales, productividad si tiene meta, notas, capacitación, ausentismo, horas extras y trayectoria */
  const clave = (s, n) => String(hash(s)).padStart(10, '0').slice(0, n);
  function division(a) {
    if (a.umf) return a.nombre === 'Medicina familiar' ? 'Medicina familiar' : 'Servicios de apoyo';
    if (/Urgencias/.test(a.nombre)) return 'División de urgencias';
    if (/Pediatr/.test(a.nombre)) return 'División de pediatría';

    if (/Cirug|Anest|Ortoped|Urolog|Oftalm|Otorrino|Neurocir|Coloproct|Angiolog/.test(a.nombre)) return 'División de cirugía';

  }
  const campo = (t, val) => `<div class="s-ficha2__campo"><dt>${t}</dt><dd>${esc(val)}</dd></div>`;
  function vMedico(m) {
    const conMeta = m.tipo === 'medico', e = expediente(m), w = ui.semana, idv = m.id;
    vista(idv, {}).tab = 'prod';
    const u = e.unidad, a = e.area, deleg = e.ooad ? e.ooad.nombre : u.nombre;
    const cvUnidad = `${clave(u.id, 2)}EA${clave(u.id + 'u', 6)}`, cvAdsc = `${cvUnidad.slice(0, 4)}${clave(a.id, 3)}E00`, cvPers = `${cvUnidad.slice(0, 4)}${clave(m.id, 2)}`;

    const icono = `<span class="s-ficha2__icono" aria-hidden="true">${I.persona}</span>`;
    const ficha = `<section class="s-card s-ficha2" aria-labelledby="t-ficha">
      <div class="s-ficha2__foto" aria-hidden="true">${avatar(m.persona, 's-avatar--foto')}</div>
      <div class="s-ficha2__cuerpo">
        <div class="s-ficha2__titulo"><h2 id="t-ficha">${esc(cap(m.nombre))}</h2>${est}</div>
        <section class="s-ficha2__grupo" aria-labelledby="t-gen"><h3 id="t-gen">Información general</h3>
          <div class="s-ficha2__fila">${icono}<dl class="s-ficha2__campos s-ficha2__campos--6">${campo('CURP', e.curp)}${campo('Matrícula', e.matricula)}${campo('Cédula', e.cedula)}${campo('Área de responsabilidad', a.nombre)}${campo(e.ooad ? 'OOAD' : 'UMAE', deleg)}${campo('Otros empleos', String(e.otrosEmpleos))}</dl></div></section>
        <section class="s-ficha2__grupo" aria-labelledby="t-cat"><h3 id="t-cat">Categoría, adscripción y jornada</h3>
          <div class="s-ficha2__fila">${icono}<dl class="s-ficha2__campos s-ficha2__campos--5">${campo('Categoría contractual', e.categoria)}${campo('Clave de categoría', e.claveCategoria)}${campo('Descripción unidad', u.nombre)}${campo('Unidad de adscripción', cvUnidad)}${campo('Descripción adscripción', division(a))}

        <tbody>${semanas.slice().reverse().map(r => { const real = r.x.cr + r.x.qr, plan = r.x.cp + r.x.qp, pct = plan ? Math.round(real / plan * 100) : null; return `<tr><td>Semana ${r.s} · ${rangoSemana(r.s).corto}</td><td class="s-der s-num">${fmt(real)} de ${fmt(plan)}</td><td class="s-der">${pct == null ? 'Sin meta' : tagCump(pct)}</td><td class="s-der s-num">${fmt(r.t)}</td></tr>`; }).join('')}</tbody></table></div></section></section>`;
    }

    const tarjeta = (clase, titulo, id, cuerpo) => `<section class="s-tarjeta s-tarjeta--${clase}" aria-labelledby="${id}"><h2 id="${id}" class="s-tarjeta__cab">${titulo}</h2>${cuerpo}</section>`;
    const par = (pares) => `<dl class="s-tarjeta__pares">${pares.map(([t, v]) => `<div><dt>${t}</dt><dd class="s-num">${v}</dd></div>`).join('')}</dl>`;

  /* ---------- Render y eventos ---------- */
  function rutaActual() { const h = location.hash.split('?')[0].replace(/^#\/?/, ''); return h.startsWith('e/') ? h.slice(2) : ''; }
  const RUTAS_SECCION = { '#/': '', '#/c/ooad': 'ooad', '#/c/umae': 'umae' };
  function render(opts) {

    ctx.alcance = hash === '#/p' ? 'Personal' : !id ? ({ todo: 'Nivel Nacional', ooad: 'OOAD', umae: 'UMAE' }[RUTAS_SECCION[hash] || 'todo']) : n.nombre;
    if (!id && !(hash in RUTAS_SECCION) && hash !== '#/p') { location.hash = '#/'; return; }
    const act = document.activeElement, focoId = act && act.id && $app.contains(act) ? act.id : null, caret = act && act.selectionStart;
    let html, sec, nombre;
    if (hash === '#/p') { sec = 'personal'; html = vPersonal(); nombre = 'Personal'; }
    else if (!id) { vista('N').tipo = RUTAS_SECCION[hash]; sec = RUTAS_SECCION[hash] || 'todo'; html = vNacional(); nombre = sec === 'todo' ? 'Todo el país' : sec.toUpperCase(); }
    else {
      sec = cadena(n)[0].tipo === 'umae' ? 'umae' : 'ooad';
      if (n.tipo === 'medico' || n.tipo === 'persona') html = vMedico(n);
      else if (n.tipo === 'area') html = vArea(n);
      else if (n.tipo === 'umae' || n.tipo === 'unidad') html = vUnidad(n);
      else html = vOoad(n);
      nombre = n.tipo === 'medico' || n.tipo === 'persona' ? cap(n.nombre) : n.nombre;
    }
    html = html.split('<!--tabs-->').join('');
    let dr = drawer();
    /* Animación del panel: entra al abrirse, sale al cerrarse (el panel sigue en pantalla un instante) */
    if (dr) { dr = dr.replace('class="s-drawer"', ui.drawerVisible ? 'class="s-drawer s-drawer--sin-entrada"' : 'class="s-drawer"'); ui.ultimoDrawer = dr; }
    else if (ui.drawerVisible && ui.ultimoDrawer && !opts.sinSalida) {
      dr = ui.ultimoDrawer.replace(/class="s-drawer[^"]*"/, 'class="s-drawer s-drawer--sale"');
      setTimeout(() => render({ sinSalida: true }), 230);
    }
    ui.drawerVisible = !!dr;
    $app.classList.toggle('s-app--drawer', !!dr);
    $app.classList.toggle('s-app--colapsado', !!ui.navColapsado);
    $app.classList.toggle('s-app--nav-abierto', !!ui.navAbierto);
    $app.innerHTML = navLateral(sec) + '<div class="s-nav-fondo" data-nav-fondo></div><div class="s-contenido"><button class="s-nav-abrir" type="button" data-nav="abrir" aria-controls="nav-lateral" aria-expanded="' + !!ui.navAbierto + '">' + I.hamburguesa + '<span>Secciones</span></button>' + html + '</div>' + dr;
    ui.pendiente = null; sincronizarURL();

    if (ui.enfocar && document.getElementById('drawer-titulo')) { ui.enfocar = false; document.getElementById('drawer-titulo').focus(); }

  function cambiarSemana(s) {
